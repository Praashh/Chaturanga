name: Render Backend Keep-Alive Cron

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Custom URL to ping (optional, defaults to RENDER_BACKEND_URL)"
        required: false
        default: ""

jobs:
  keep-alive:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send Keep-Alive Ping
        run: |
          TARGET="${{ github.event.inputs.target_url || secrets.RENDER_BACKEND_URL || vars.RENDER_BACKEND_URL }}"

          if [ -z "$TARGET" ]; then
            echo "⚠️ No RENDER_BACKEND_URL configured."
            echo "To configure:"
            echo "1. Go to your GitHub repository -> Settings -> Secrets and variables -> Actions."
            echo "2. Add a Repository Variable or Secret named RENDER_BACKEND_URL (e.g. https://your-service.onrender.com)."
            exit 0
          fi

          CLEAN_URL="${TARGET%/}"
          PING_URL="${CLEAN_URL}/api/health"

          echo "⏱️ Pinging Render backend: ${PING_URL} at $(date -u)"

          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" -m 60 "$PING_URL" || echo -e "\n000")
          HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -n1)
          BODY=$(echo "$HTTP_RESPONSE" | sed '$d')

          echo "HTTP Status Code: ${HTTP_STATUS}"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Backend is active, warm, and responded successfully:"
            echo "$BODY"
          else
            echo "Backend responded with HTTP ${HTTP_STATUS}. If cold, it will now be waking up."
          fi
