services:
  chaturanga-db:
    image: postgres:15-alpine
    container_name: chaturanga-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chaturanga
    volumes:
      - chaturanga-db-data:/var/lib/postgresql/data
    networks:
      - chaturanga-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chaturanga"]
      interval: 5s
      timeout: 5s
      retries: 5

  chaturanga-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chaturanga-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:password@chaturanga-db:5432/chaturanga?schema=public
    depends_on:
      chaturanga-db:
        condition: service_healthy
    networks:
      - chaturanga-net

volumes:
  chaturanga-db-data:

networks:
  chaturanga-net:
    driver: bridge
